<!doctype html>
<html lang="zh-CN" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 站点身份由 vite.config.ts 的 site-meta 插件从 src/content/site.ts 注入 -->
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>__SITE_TITLE__</title>
    <!-- 强调色防闪烁:渲染前恢复持久化选择 -->
    <script>
      try {
        var a = localStorage.getItem('md-accent');
        if (a) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- 主体内容 -->
    <div id="root"></div>
    <!-- noscript -->
    <noscript>
      <div style="text-align: center; color: #e8eaed">请开启 JavaScript</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
